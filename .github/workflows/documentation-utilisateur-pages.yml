name: Publier la documentation utilisateur

on:
  push:
    branches:
      - main
    paths:
      - "docs/utilisateur/**"
      - "docs/requirements.txt"
      - "mkdocs.yml"
      - ".github/workflows/documentation-utilisateur-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer MkDocs
        run: pip install -r docs/requirements.txt

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Construire le site
        run: mkdocs build --strict --site-dir ./_site

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
