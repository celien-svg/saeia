services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sae_suivi_pret
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./src/suivi_pret:/app/src/suivi_pret
